[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The "preview" branch deploys the server-rendered draft preview.
# Everything else builds the static public site.
[context.preview.environment]
  SITE_MODE = "preview"

# Astro fingerprints everything in /_astro, so it is safe to cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Font files keep their names, so they are cached for a month, not forever.
# When you replace a font, give the file a new name so visitors get it straight away.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
